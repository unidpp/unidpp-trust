name: Test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: unidpp-trust
    steps:
      # The crate path-depends on the sibling repositories; check
      # them out side by side, mirroring the family layout the
      # manifests assume.
      - uses: actions/checkout@v4
        with:
          path: unidpp-trust
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-core
          path: unidpp-core
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-signatif
          path: unidpp-signatif

      # No toolchain step: rustup resolves rust-toolchain.toml at
      # every cargo invocation, so CI installs and formats with the
      # exact pinned generation (the file is the single source).
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all

